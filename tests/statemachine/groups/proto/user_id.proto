syntax = "proto3";

package user_id;

message UserId {
  string id = 1;
}

message Name {
  string full = 1;
  string first = 2;
  string last = 3;
}

message DisplayUser {
  UserId user_id = 1;
  Name name = 2;
  string profile_image_url = 3;
  string email = 4;
  AccountType account_type = 5;
  string username = 6;
}

enum AccountType {
  UNKNOWN_USER_TYPE = 0;
  GOOGLE = 1;
  GITHUB = 2;
  SAML = 3;
  OIDC = 4;
}
